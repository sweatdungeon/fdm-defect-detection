[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fdm-defect"
version = "0.1.0"
description = "Detect under-extrusion in FDM 3D printing from nozzle-camera images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sweatdungeon", email = "pnaj0002@student.monash.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-html>=4.0",
    "pdoc>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
